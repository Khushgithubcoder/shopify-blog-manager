services:
  - type: web
    name: shopify-blog-manager
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /login.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-blog-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SHOPIFY_SCOPES
        value: read_content,write_content
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: ENCRYPTION_KEY
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: APP_URL          # e.g. https://shopify-blog-manager.onrender.com
        sync: false

databases:
  - name: shopify-blog-db
    databaseName: shopify_blog
    user: shopify_user
    plan: free
